version: 2

project_name: drover-ch-optimiser

builds:
  - id: drover-ch
    main: ./cmd/drover-ch
    binary: drover-ch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
  - id: drover-ch-mcp
    main: ./cmd/drover-ch-mcp
    binary: drover-ch-mcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w

archives:
  - id: default
    formats:
      - tar.gz
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true

release:
  github:
    owner: cloud-shuttle
    name: drover-ch-optimiser
  draft: false
  prerelease: false
  mode: append
